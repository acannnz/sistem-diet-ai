# Sistem Diet (FastAPI) — vhost Nginx manual, DI LUAR panel HestiaCP.
#
# Dipasang ke /etc/nginx/conf.d/sistem-diet.conf oleh setup.sh.
# __LISTEN_IP__ diganti dengan IP yang dipakai Hestia, karena Nginx memilih server block
# berdasarkan alamat listen yang paling spesifik terlebih dahulu.
#
# JANGAN membuat web domain sistem-diet.arcand.my.id di panel Hestia (bentrok server_name).
# TLS: Let's Encrypt (certbot, webroot). DNS arcand.my.id di Domainesia (tidak lewat Cloudflare).

server {
    listen __LISTEN_IP__:80;
    server_name __DOMAIN__;

    # Validasi Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# __HTTPS_START__
server {
    listen __LISTEN_IP__:443 ssl;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    access_log /var/log/nginx/sistem-diet.access.log;
    error_log  /var/log/nginx/sistem-diet.error.log warn;

    # Foto makanan dikompres di HP (~200 KB), batas ini hanya pengaman
    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Ditimpa (bukan ditambah) supaya pembatas percobaan login tidak bisa dikelabui
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Scan + pemilihan TKPI oleh AI bisa butuh beberapa detik
        proxy_read_timeout 120s;
    }
}
# __HTTPS_END__
